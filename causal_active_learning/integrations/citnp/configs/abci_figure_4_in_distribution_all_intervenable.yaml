# ABCI Figure 4 (a), in-distribution variant: as the literal variant, with the
# numbers moved inside what oracle_d5_iw_a15_sc.yaml trained the model on
# (context 64-360 rows, >= 33 observational rows, do-values on the raw scale
# with the widest range [-6, 6]). Expected support flags: none (small first
# regimes are recorded, not flagged).
extends: abci_figure_4_all_intervenable.yaml
name: abci_figure_4_in_distribution_all_intervenable
initial_observational_rows: 64    # prior: context >= 64 rows (n_ctx_range);
                                  # above the 33-row observational minimum;
                                  # final context 64 + 50 x 3 = 214 <= 360
active_learning:
  acquisition_budget: 50          # ABCI: 50 experiments
  rows_per_acquisition: 3         # ABCI: N_t = 3
  intervenable_nodes: null        # panel (a): all nodes
  include_observational_candidate: true
  fixed_intervention_value: 0.0   # ABCI RAND-FIXED
  random_value_range: [-6.0, 6.0] # prior: widest do-value range U(-6, 6)
  value_domain: fixed_range
  value_domain_fixed_range: [-6.0, 6.0]   # prior: widest do-value range
