# ABCI Figure 4 (a): all nodes intervenable, inside the CITNP model's training
# distribution (oracle_d5_iw_a15_sc.yaml).
# Toth et al., "Active Bayesian Causal Inference", NeurIPS 2022, Section 5,
# Figure 4 and Appendix F. "ABCI" marks the paper's numbers, "prior" the
# training prior's. Mechanisms come from the --data_config's prior (linear
# Gaussian, inverse Wishart), not ABCI's GP mechanisms, so absolute KL values
# are not comparable with the paper.
name: abci_figure_4_all_intervenable
task_source:
  kind: fixed_graph
  num_variables: 5                # ABCI: five nodes
  # X1->X2, X1->X3, X1->X4, X2->X3, X2->X4, X3->X5, X4->X5
  # (ABCI Figure 4; confirmed by Ruizi)
  edges: [[0, 1], [0, 2], [0, 3], [1, 2], [1, 3], [2, 4], [3, 4]]
  num_tasks: 10                   # ABCI: 10 ground-truth SCMs
  restarts_per_task: 3            # ABCI: 3 restarts each, 30 runs
query:
  treatment: 2                    # ABCI: X3 (query p(X5 | do(X3 = psi)))
  outcome: 4                      # ABCI: X5
  treatment_range: [2.0, 5.0]     # ABCI: psi ~ U[2, 5] (inside the prior's
                                  #   do-value range)
  num_query_samples: 16           # psi values drawn once per task, shared by
                                  #   all strategies, restarts and panels
initial_observational_rows: 64    # prior: smallest context n_ctx_range[0] = 64
                                  #   (ABCI: 5); the initial context is purely
                                  #   observational, above the 33-row minimum
strategies: [expected_information_gain, observational, random_fixed_value,
             random]              # ABCI: U_CR (our EIG), OBS, RAND-FIXED, RAND
active_learning:
  acquisition_budget: 50          # ABCI: 50 experiments; final context
                                  #   64 + 50 x 3 = 214 rows <= 360 (prior)
  rows_per_acquisition: 3         # ABCI: N_t = 3 samples per experiment
  intervenable_nodes: null        # ABCI panel (a): all nodes
  include_observational_candidate: true   # ABCI: targets include the empty set
  fixed_intervention_value: 0.0   # ABCI RAND-FIXED: value 0
  random_value_range: [-6.0, 6.0] # prior: widest do-value range U(-6, 6)
                                  #   (ABCI RAND: U(-7, 7))
  value_domain: fixed_range
  value_domain_fixed_range: [-6.0, 6.0]   # prior: widest do-value range
