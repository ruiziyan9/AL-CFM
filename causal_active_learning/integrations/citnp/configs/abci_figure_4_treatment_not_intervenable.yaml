# ABCI Figure 4 (b): the treatment X3 is not intervenable. `extends` replaces
# top-level keys whole, so the active_learning section is repeated in full;
# only `name` and `intervenable_nodes` differ from
# abci_figure_4_all_intervenable.yaml (see that file for the sources).
extends: abci_figure_4_all_intervenable.yaml
name: abci_figure_4_treatment_not_intervenable
active_learning:
  acquisition_budget: 50          # ABCI: 50 experiments
  rows_per_acquisition: 3         # ABCI: N_t = 3
  # Explicit, so old and new results are never confused by the default: the
  # first Figure 4 runs (before the entropy objectives) used kl_divergence.
  information_gain_objective: entropy_reduction
  intervenable_nodes: [0, 1, 3, 4]   # ABCI panel (b): X3 (node 2) removed
  include_observational_candidate: true   # ABCI: targets include the empty set
  fixed_intervention_value: 0.0   # ABCI RAND-FIXED: value 0
  random_value_range: [-6.0, 6.0] # prior: widest do-value range (ABCI: U(-7, 7))
  value_domain: fixed_range
  value_domain_fixed_range: [-6.0, 6.0]   # prior: widest do-value range
