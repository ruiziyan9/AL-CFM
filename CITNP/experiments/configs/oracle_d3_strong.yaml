# D=3 conjugate linear-Gaussian prior with stronger effects and more
# confounding. Same family and raw scale as oracle_d3.yaml, so the exact Bayes
# oracle still applies; it reads weight_scale and the graph prior (via
# sample_graph) from this file. Differences from oracle_d3.yaml:
#   weight_scale 4         w ~ N(0, 4 s2) instead of N(0, s2): typical edge
#                          |corr| ~0.3 -> ~0.5
#   graph_type ER + ER_CC  half the graphs are conditioned to contain a common
#   graph_degrees 2-3      cause; questions: ~63% Y|T != Y|do(T), ~19%
#                          confounded (8% confounded effect, 11% pure)
#   p_k0 0.15, p_geom 0.3  15% observation-only contexts; otherwise K in {1,2,3}
#   qry_type_probs         question treatments seen / unseen in the context 50/50
function_generator: linearnonidentifiable
num_variables: [3]
graph_type: [ER, ER, ER_CC]
graph_degrees: {3: [2, 3]}
normalise: false        # raw scale, so the prior stays conjugate
weight_scale: 4.0
k_max: 3
p_k0: 0.15
p_geom: 0.3
n_ctx_range: [64, 256]
n_qry: 48
qry_mode: grouped
qry_groups: [1, 2, 3]
qry_type_probs: [0.5, 0.5, 0.0]   # grouped mode uses (seen, unseen) only
n_obs_min: 32
