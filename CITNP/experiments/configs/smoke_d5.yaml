# Smoke-test data config with five variables: smoke_d3.yaml with only what
# depends on D changed. graph_degrees replaces the parent's dictionary whole
# (it is not merged), so it lists only D = 5 (as in oracle_d5_iw_a15.yaml).
# n_qry must be divisible by every G in qry_groups: the parent's 48 is not
# divisible by 5, so it becomes 60 (as in oracle_d5_iw_a15.yaml).
extends: smoke_d3.yaml
num_variables: [5]
graph_degrees: {5: [3, 5, 8, 9]}
k_max: 5
n_qry: 60
qry_groups: [1, 2, 3, 4, 5]
